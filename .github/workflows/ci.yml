name: Backend Microservices CI & Build Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-go-services:
    name: Build & Test Go Microservices
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - order-service
          - catalog-service
          - auth-service
          - community-care-service
          - iot-ai-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22+
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Verify Go Module & Vet Code
        run: |
          cd services/${{ matrix.service }}
          go mod tidy
          go vet ./...

      - name: Compile Go Binary (CGO_ENABLED=0)
        run: |
          cd services/${{ matrix.service }}
          CGO_ENABLED=0 go build -ldflags="-w -s" -v ./...

      - name: Run Unit Tests
        run: |
          cd services/${{ matrix.service }}
          go test -v ./...

  test-worker-ts:
    name: Build TypeScript Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: services/worker-ts/package-lock.json

      - name: Install dependencies
        run: |
          cd services/worker-ts
          npm ci

      - name: Build TypeScript Worker
        run: |
          cd services/worker-ts
          npm run build

      - name: Verify Worker Artifacts
        run: |
          test -f services/worker-ts/dist/index.js
          echo "Verified services/worker-ts/dist/index.js exists"

  validate-docker-compose-and-infra:
    name: Validate Compose & Deployment Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Test Suite Syntax
        run: |
          python -m py_compile tests/e2e_test.py tests/stress_test.py

      - name: Verify Deployment Script Syntax
        run: |
          bash -n scripts/deploy.sh

      - name: Validate Local & Production Compose Configs
        run: |
          cp -n .env.production.example .env || true
          docker compose config -q
          docker compose -f docker-compose.prod.yml config -q
