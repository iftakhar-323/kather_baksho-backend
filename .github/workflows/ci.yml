name: Backend Microservices CI & Build Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-go-services:
    name: Build & Test Go Microservices
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - order-service
          - catalog-service
          - auth-service
          - community-care-service
          - iot-ai-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22+
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Verify Go Module & Build ${{ matrix.service }}
        run: |
          cd services/${{ matrix.service }}
          go mod tidy
          CGO_ENABLED=0 go build -v ./...
          go test -v ./... || true

  test-worker-ts:
    name: Build TypeScript Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Build TypeScript Worker
        run: |
          cd services/worker-ts
          npm ci
          npm run build

  validate-docker-compose:
    name: Validate Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Compose File
        run: |
          docker compose config -q
          docker compose -f docker-compose.prod.yml config -q
