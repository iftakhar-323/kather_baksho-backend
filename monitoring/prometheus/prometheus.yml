global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/spm_rules.yml"

scrape_configs:
  - job_name: 'kather_baksho-order'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['order-service:8081']

  - job_name: 'jaeger'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['jaeger:14269']
