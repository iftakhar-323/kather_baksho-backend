apiVersion: v1
kind: ConfigMap
metadata:
  name: kather-baksho-config
  namespace: kather-baksho
  labels:
    app.kubernetes.io/part-of: kather-baksho
data:
  GIN_MODE: "release"
  ALLOWED_ORIGINS: "*"
  REDIS_ADDR: "redis-service:6379"
  MONGO_URI: "mongodb://mongo-service:27017"
  MONGO_DB_NAME: "kather_baksho_iot"
  ORDER_SERVICE_URL: "http://order-service:8081"
  CATALOG_SERVICE_URL: "http://catalog-service:8087"
  AUTH_SERVICE_URL: "http://auth-service:8084"
  COMMUNITY_CARE_SERVICE_URL: "http://community-care-service:8088"
  IOT_AI_SERVICE_URL: "http://iot-ai-service:8089"
  WORKER_TS_URL: "http://worker-ts:8083"
  MQTT_BROKER_URL: "tcp://mosquitto-service:1883"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-service:4318"
  DB_PATH: "/app/data/orders.db"
  CATALOG_DB_PATH: "/app/data/catalog.db"
  AUTH_DB_PATH: "/app/data/auth.db"
  SMS_PROVIDER: "logger"
---
apiVersion: v1
kind: Secret
metadata:
  name: kather-baksho-secret
  namespace: kather-baksho
  labels:
    app.kubernetes.io/part-of: kather-baksho
type: Opaque
stringData:
  JWT_SECRET: "katherbox_production_k8s_jwt_super_secure_2026"
  PAYMENT_SECRET: "katherbox_default_secure_payment_hmac_secret_2026"
  BKASH_APP_KEY: "sandbox_app_key"
  BKASH_APP_SECRET: "sandbox_app_secret"
  BKASH_USERNAME: "sandbox_user"
  BKASH_PASSWORD: "sandbox_password"
  SSLCOMMERZ_STORE_ID: "sandbox_store_id"
  SSLCOMMERZ_STORE_PASS: "sandbox_store_pass"
  GREENWEB_SMS_TOKEN: "mock_greenweb_token"
  TWILIO_ACCOUNT_SID: "mock_twilio_sid"
  TWILIO_AUTH_TOKEN: "mock_twilio_auth"
  TWILIO_FROM_NUMBER: "+15551234567"
