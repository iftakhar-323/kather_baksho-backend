apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: kather-baksho
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: kather_baksho-order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: kather-baksho-config
            - secretRef:
                name: kather-baksho-secret
          env:
            - name: PORT
              value: "8081"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: shared-data
              mountPath: /app/data
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: sqlite-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: kather-baksho
spec:
  selector:
    app: order-service
  ports:
    - port: 8081
      targetPort: 8081
---
